name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils

      - name: Shell syntax
        run: |
          bash -n bin/notestrip
          bash -n bin/ledge
          bash -n test/smoke.sh
          bash -n test/migration.sh
          bash -n test/packaging-covers-sources.sh

      - name: Shellcheck
        run: shellcheck bin/notestrip bin/ledge test/smoke.sh test/migration.sh test/packaging-covers-sources.sh

      - name: Legacy state migration
        run: ./test/migration.sh

      - name: Markup unit tests
        # The only part of the app with no Qt in it, so the only part that can
        # be checked without a compositor. Everything else needs a real session.
        run: node test/markup.js

      - name: Desktop entry
        run: desktop-file-validate notestrip.desktop

      - name: Packaging covers every shell file
        # The package once shipped without Core/Markup.js because the install
        # step filtered by extension. Nothing about that was visible in review,
        # only in a built package, so it is asserted here instead.
        run: ./test/packaging-covers-sources.sh
